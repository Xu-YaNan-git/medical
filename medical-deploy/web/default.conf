# 医疗助手 · 静态 UI + API 同源反代
# 8765 = 患者端；36967 = 医生端。compose 内置 DNS：127.0.0.11
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

client_max_body_size 20m;
server_tokens off;

server {
    listen 8765;
    server_name _;
    root /usr/share/nginx/html/patient;
    index index.html;

    include /etc/nginx/conf.d/api-proxy.inc;

    location = /sw.js     { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /config.js { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /manifest.webmanifest { default_type application/manifest+json; try_files $uri =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 36967;
    server_name _;
    root /usr/share/nginx/html/doctor;
    index index.html;

    include /etc/nginx/conf.d/api-proxy.inc;

    location = /config.js { add_header Cache-Control "no-cache" always; try_files $uri =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
